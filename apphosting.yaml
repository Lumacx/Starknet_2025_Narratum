build:
  command: corepack enable && pnpm install --frozen-lockfile && pnpm build

run:
  command: pnpm start -- -p $PORT

env:
  - variable: FIREBASE_FUNCTIONS_BASE_URL
    value: https://us-central1-narratum.cloudfunctions.net
  - variable: FIREBASE_PROJECT_ID
    secret: FIREBASE_PROJECT_ID
    availability: [RUNTIME]
  - variable: FIREBASE_CLIENT_EMAIL
    secret: FIREBASE_CLIENT_EMAIL
    availability: [RUNTIME]
  - variable: FIREBASE_PRIVATE_KEY_BASE64
    secret: FIREBASE_PRIVATE_KEY_BASE64
    availability: [RUNTIME]
  - variable: PAYPAL_CLIENT_ID
    secret: PAYPAL_CLIENT_ID
    availability: [RUNTIME]
  - variable: PAYPAL_SECRET_KEY
    secret: PAYPAL_SECRET_KEY
    availability: [RUNTIME]
  - variable: PAYPAL_ENV
    secret: PAYPAL_ENV
    availability: [RUNTIME]
