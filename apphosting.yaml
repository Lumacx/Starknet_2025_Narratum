# Firebase App Hosting config for Next.js (SSR)
build:
  command: >
    corepack enable &&
    pnpm install --frozen-lockfile &&
    pnpm build

run:
  command: pnpm start -- -p $PORT

env:
  # ── Runtime basics ────────────────────────────────────────────────────────────
  - variable: NODE_ENV
    value: production
    availability: [ RUNTIME ]
  - variable: NEXT_TELEMETRY_DISABLED
    value: "1"
    availability: [ BUILD, RUNTIME ]

  # ── Functions base URL (client + server) ─────────────────────────────────────
  - variable: FIREBASE_FUNCTIONS_BASE_URL
    value: https://us-central1-narratum.cloudfunctions.net
    availability: [ BUILD, RUNTIME ]
  - variable: NEXT_PUBLIC_FUNCTIONS_BASE_URL
    value: https://us-central1-narratum.cloudfunctions.net
    availability: [ BUILD, RUNTIME ]

  # ── Firebase Admin (server-only secrets) ─────────────────────────────────────
  - variable: FIREBASE_PROJECT_ID
    secret: FIREBASE_PROJECT_ID
    availability: [ RUNTIME ]
  - variable: FIREBASE_CLIENT_EMAIL
    secret: FIREBASE_CLIENT_EMAIL
    availability: [ RUNTIME ]
  - variable: FIREBASE_PRIVATE_KEY_BASE64
    secret: FIREBASE_PRIVATE_KEY_BASE64
    availability: [ RUNTIME ]

  # ── PayPal (client + server) ─────────────────────────────────────────────────
  # Expose client ID to browser; keep secret server-only.
  - variable: NEXT_PUBLIC_PAYPAL_CLIENT_ID
    secret: PAYPAL_CLIENT_ID
    availability: [ BUILD, RUNTIME ]
  - variable: PAYPAL_SECRET_KEY
    secret: PAYPAL_SECRET_KEY
    availability: [ RUNTIME ]
  # "live" | "sandbox" — some client code branches on this; allow at build/runtime
  - variable: PAYPAL_ENV
    secret: PAYPAL_ENV
    availability: [ BUILD, RUNTIME ]

  # ── Firebase Web config (public) ─────────────────────────────────────────────
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: "AIzaSyCwED8ecLP9ig2QNmBUO_HAWiI9X2ujV0U"
    availability: [ BUILD, RUNTIME ]
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: "narratum.firebaseapp.com"
    availability: [ BUILD, RUNTIME ]
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: "narratum"
    availability: [ BUILD, RUNTIME ]
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: "narratum.firebasestorage.app"
    availability: [ BUILD, RUNTIME ]
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "286262915752"
    availability: [ BUILD, RUNTIME ]
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: "1:286262915752:web:dd9694d4583a7de67e089d"
    availability: [ BUILD, RUNTIME ]
  - variable: NEXT_PUBLIC_FIREBASE_DATABASE_URL
    value: "https://narratum-default-rtdb.firebaseio.com"
    availability: [ BUILD, RUNTIME ]

  # ── Google Sign-In (GSI) ─────────────────────────────────────────────────────
  - variable: NEXT_PUBLIC_GOOGLE_CLIENT_ID
    value: "286262915752-a2fqle4aki4tb9sj2npdumhrdqj5g9mm.apps.googleusercontent.com"
    availability: [ BUILD, RUNTIME ]

  # ── Optional: feature flag to detect App Hosting at runtime ──────────────────
  - variable: NEXT_PUBLIC_APP_HOSTING
    value: "1"
    availability: [ BUILD, RUNTIME ]
