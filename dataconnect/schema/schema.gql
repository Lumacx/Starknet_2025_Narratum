# This is a basic schema for a blog.
# It's intended to be a starting point for your own customizations.
# For more information, see https://firebase.google.com/docs/dataconnect

# Defines a User type, which is a top-level collection in the database.
type User @table(name: "users") {
  id: String! @primaryKey
  displayname: String
  avatarUrl: String
  stories: [Story] @relation(field: "authorId")
  comments: [Comment] @relation(field: "authorId")
}

# Defines a Story type, which is a top-level collection in the database.
type Story @table(name: "stories") {
  id: String! @primaryKey
  author: User @relation(field: "authorId")
  authorId: String!
  title: String!
  description: String
  genre: String
  tags: [String]
  coverImageUrl: String
  status: String # e.g., 'draft', 'published', 'archived'
  createdAt: Timestamp
  updatedAt: Timestamp
  storyContent: [StoryContent] @relation(field: "storyId")
  comments: [Comment] @relation(field: "storyId")
}

# Defines a StoryContent type, which is a top-level collection in the database.
type StoryContent @table(name: "story_content") {
  id: String! @primaryKey
  story: Story @relation(field: "storyId")
  storyId: String!
  pageNumber: Int!
  textContent: String
  imageUrl: String
  audioUrl: String
}

# Defines a Comment type, which is a top-level collection in the database.
type Comment @table(name: "comments") {
  id: String! @primaryKey
  story: Story @relation(field: "storyId")
  storyId: String!
  author: User @relation(field: "authorId")
  authorId: String!
  content: String!
  createdAt: Timestamp
}
