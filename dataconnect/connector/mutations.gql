# Thiss is an example of how to use mutations with DataConnect
# For more information about mutations, please visit
# https://firebase.google.com/docs/dataconnect/mutations

mutation CreateUser($userId: String!, $displayname: String, $avatarUrl: String) {
  users {
    create(
      data: {
        id: $userId
        displayname: $displayname
        avatarUrl: $avatarUrl
      }
    ) {
      id
    }
  }
}

mutation CreateStoryWithContent($storyId: String!, $authorId: String!, $title: String!, $description: String, $genre: String, $coverImageUrl: String, $status: String, $storyContent: [StoryContentInput!]) {
  stories {
    create(
      data: {
        id: $storyId
        authorId: $authorId
        title: $title
        description: $description
        genre: $genre
        coverImageUrl: $coverImageUrl
        status: $status
        storyContent: {
          create: $storyContent
        }
      }
    ) {
      id
    }
  }
}

input StoryContentInput {
  storyId: String!
  pageNumber: Int!
  textContent: String
  imageUrl: String
  audioUrl: String
}
